AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "lib/polytypo/data/**/*"
    - "vendor/**/*"

# This project's deliberate style choices, not RuboCop's own opinionated defaults:
#
# - Double-quoted strings throughout (frozen_string_literal makes the historical
#   single-vs-double performance argument moot; consistency, not either quote style, is what
#   matters).
# - Short, domain-specific parameter/local names (cp, ch, a, b, i, j, k, ...) matching every
#   other polytypo port's own variable names exactly -- a reviewer comparing this file to the
#   JS/Python/Go equivalent benefits from the identical name, not a renamed one.
# - Chained numeric/array comparisons (`cp >= A && cp <= B`, `x == A || x == B`) mirroring the
#   reference implementations' own structure line for line, rather than the more "idiomatic
#   Ruby" `.between?`/`Array#include?` forms -- cross-runtime comparability wins here.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Naming/MethodParameterName:
  AllowedNames:
    - cp
    - ch
    - i
    - j
    - k
    - m
    - n
    - a
    - b
    - c
    - d
    - e
    - p
    - q
    - r
    - s
    - w
    - x
    - y
    - to
    - from

Style/ComparableBetween:
  Enabled: false
Style/MultipleComparison:
  Enabled: false

# The typography rules are index-based scans with many named guards (matching the JS/Python/Go
# reference implementations' own structure) -- long methods and high complexity are inherent to
# a single left-to-right scan with explicit lookaround, not a style problem to fix by splitting
# arbitrarily (ARCHITECTURE.md section 4.1: no regex, a single scan, explicit index guards).
Metrics/MethodLength:
  Max: 150
Metrics/AbcSize:
  Max: 100
Metrics/CyclomaticComplexity:
  Max: 40
Metrics/PerceivedComplexity:
  Max: 40
Metrics/ClassLength:
  Max: 800
Metrics/ModuleLength:
  Max: 800
Metrics/ParameterLists:
  Max: 6
Metrics/BlockNesting:
  Max: 5
Metrics/BlockLength:
  Max: 60
  Exclude:
    - "spec/**/*"

# unicode_util.rb's LETTER_RANGES/UPPER_RANGES/SIMPLE_UPPERCASE are ported verbatim, entry for
# entry, from the JS reference implementation's own frozen Unicode 17.0 tables (see that file's
# own header comment) -- not hand-written data a human should instead read from an external
# source, and not numbers a human picked that would benefit from underscore grouping.
Metrics/CollectionLiteralLength:
  Exclude:
    - "lib/polytypo/engine/unicode_util.rb"
Style/NumericLiterals:
  Exclude:
    - "lib/polytypo/engine/unicode_util.rb"

Style/Documentation:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false
Layout/EmptyLineAfterGuardClause:
  Enabled: false

# Formatting-only, not correctness: this codebase's rule files were written independently (one
# per typography rule) and not run through a single auto-formatter pass across all of them.
Style/TrailingCommaInArguments:
  Enabled: false
Style/TrailingCommaInArrayLiteral:
  Enabled: false
Layout/FirstArrayElementIndentation:
  Enabled: false
Layout/ArgumentAlignment:
  Enabled: false
Layout/ExtraSpacing:
  Enabled: false
Layout/MultilineOperationIndentation:
  Enabled: false
Layout/LineEndStringConcatenationIndentation:
  Enabled: false

Layout/LineLength:
  Max: 140
