name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Lint (RuboCop)
        run: bundle exec rubocop

      - name: Test
        run: bundle exec rspec --exclude-pattern "spec/packaging_spec.rb"

      # Installs the actual built .gem into a scratch location and exercises every public entry
      # point from there -- a $LOAD_PATH-based run against the working tree (every other spec)
      # cannot catch a packaging defect like a gemspec `files` list missing a data file.
      - name: Packaging smoke test
        run: bundle exec rspec spec/packaging_spec.rb

  vendored-spec:
    name: Vendored spec matches canonical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      # The vendored spec subset in this repository is a manually synced copy of canonical
      # polytypo's spec/. Its data half stays current because the test suite fails without it;
      # nothing checked its rules/*.md half, and four published packages shipped rule
      # documentation that contradicted their own engine (polytypo/polytypo#56). This compares
      # every vendored file against canonical at the tag the vendored VERSION names, so a stale
      # copy — or a released spec amended in place — fails here rather than reaching a package.
      # Completeness is checked against canonical's own tree, so a deleted vendored file fails
      # too, and a tree current with the tag it claims while canonical has tagged a newer
      # version is a warning here and a refusal in the release job.
      - name: Compare against canonical spec tag
        run: sh script/check-vendored-spec.sh lib/polytypo/data
